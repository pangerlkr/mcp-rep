version: '3.8'

services:
  mcp-builder:
    build: .
    container_name: mcp-server-builder
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.example.description=MCP Server Builder Platform"
      - "com.example.version=1.0.0"
